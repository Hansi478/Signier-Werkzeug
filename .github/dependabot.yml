# Dependabot schlägt neue Versionen als Pull Request vor - für die GitHub
# Actions (Festlegung auf Commit-SHAs bleibt, neuer SHA + Versions-Kommentar)
# und für die Bau-Pakete in requirements-bau.txt (feste Versionen mit
# Prüfsummen). Die Tests in pruefen.yml laufen auf jedem Vorschlag; übernommen
# wird nur nach Prüfung. Sicherheitslücken meldet Dependabot sofort, wenn in den
# Repository-Einstellungen "Dependabot alerts" und "security updates" an sind.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Actions"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      bau-pakete:
        patterns: ["*"]
    commit-message:
      prefix: "Bau-Pakete"
