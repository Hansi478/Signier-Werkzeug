# Baut die Signier-Werkzeug.exe unter Windows, sobald ein Tag v<Version>
# gesetzt wird, und legt sie als ENTWURF eines Releases ab. Veröffentlicht
# (und damit für Updates sichtbar) wird erst, wenn der Herausgeber den
# Entwurf im Signier-Werkzeug mit seinem Schlüssel signiert hat.
#
# Sicherheit (siehe SICHERHEIT.md):
# - Auslöser nur der Tag-Push (keine pull_request/pull_request_target-Läufe,
#   also nie Code oder Secrets aus Forks).
# - GITHUB_TOKEN standardmäßig nur lesend; Schreibrecht hat allein der Job
#   "entwurf", der keinen Code aus dem Repository ausführt.
# - Alle Actions auf geprüfte Commit-SHAs festgelegt (Version im Kommentar).
# - Der Tag muss auf einem Commit von main liegen; Tag und VERSION müssen passen.
# - Die exe wird zwischen den Jobs per Prüfsumme abgeglichen und erhält eine
#   Build-Attestation (Herkunftsnachweis, prüfbar mit "gh attestation verify").
# - Kein Signierschlüssel im Bau: signiert wird nur lokal im Signier-Werkzeug.
name: Bauen

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: bauen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.summe.outputs.sha256 }}
    env:
      TAG: ${{ github.ref_name }}
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag muss auf main liegen
        shell: pwsh
        run: |
          git rev-parse --verify --quiet origin/main | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Zweig main nicht gefunden" }
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main
          if ($LASTEXITCODE -ne 0) { throw "Der Tag $env:TAG liegt nicht auf main - es wird nichts gebaut." }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64

      - name: Tag und VERSION im Quelltext müssen übereinstimmen
        shell: pwsh
        run: |
          $v = (Select-String -Path signier_werkzeug.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG passt nicht zu VERSION $v im Quelltext" }

      - name: Pakete (feste Versionen mit Prüfsummen)
        run: "python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r bau-anforderungen.txt"

      - name: Sicherheitstests
        run: python -m unittest discover -s tests -v

      - name: Bauen
        run: python -m PyInstaller --noconfirm --onefile --noconsole --name Signier-Werkzeug --icon signier.ico --hidden-import cryptography.hazmat.primitives.asymmetric.ed25519 signier_werkzeug.py

      - name: Selbsttest der exe
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath dist\Signier-Werkzeug.exe -ArgumentList '--selbsttest', "$PWD\selbst.txt"
          $t = Get-Content selbst.txt
          Write-Host $t
          if (-not $t.StartsWith('OK')) { throw 'Selbsttest fehlgeschlagen' }

      - name: Prüfsumme
        id: summe
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\Signier-Werkzeug.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$h" >> $env:GITHUB_OUTPUT
          Write-Host "SHA-256 der exe: $h"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signier-werkzeug-exe
          path: dist/Signier-Werkzeug.exe
          if-no-files-found: error
          retention-days: 7

  entwurf:
    needs: bauen
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Release-Entwurf anlegen
      id-token: write        # Build-Attestation (Sigstore)
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signier-werkzeug-exe
          path: dist

      - name: Prüfsumme gegen den Bau abgleichen
        env:
          ERWARTET: ${{ needs.bauen.outputs.sha256 }}
        run: |
          ist=$(sha256sum dist/Signier-Werkzeug.exe | cut -d' ' -f1)
          echo "SHA-256 der exe: $ist"
          if [ -z "$ERWARTET" ] || [ "$ist" != "$ERWARTET" ]; then echo "Prüfsumme weicht vom Bau ab"; exit 1; fi

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/Signier-Werkzeug.exe

      - name: Entwurf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          SUMME: ${{ needs.bauen.outputs.sha256 }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Ungeprüfter Entwurf aus Commit %s.\n\nSHA-256 der exe: %s\n\nGebaut von: %s\n\nWird erst sichtbar, wenn er im Signier-Werkzeug signiert und veröffentlicht wurde.\n' \
            "$COMMIT" "$SUMME" "$LAUF" > notizen.txt
          gh release create "$TAG" dist/Signier-Werkzeug.exe --draft --verify-tag --title "Signier-Werkzeug $TAG" --notes-file notizen.txt
